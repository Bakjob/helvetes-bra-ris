background {
    monitor =
    # Samma stabila symlink som hyprpaper.conf - uppdateras av
    # wallpaper-cycle.sh, alltid den faktiskt aktiva bakgrunden. Pekade
    # tidigare på forrest-background1.png, en fil Jakob själv tog bort
    # för länge sen (svart låsskärm som följd), se
    # vault/03-felsokning/hyprlock-svart-bakgrund.md.
    path = /home/jakob/dotfiles/images/backgrounds/.current.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.55
}

general {
    hide_cursor = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(236, 227, 198, 1.0)
    font_size = 90
    font_family = IBM Plex Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    color = rgba(147, 160, 140, 1.0)
    font_size = 20
    font_family = IBM Plex Mono
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(64, 68, 55, 0.85)
    inner_color = rgba(23, 33, 26, 0.85)
    font_color = rgba(236, 227, 198, 1.0)
    check_color = rgba(212, 162, 74, 1.0)
    fail_color = rgba(193, 84, 63, 1.0)
    placeholder_text = <span foreground="##93a08c">Lösenord...</span>
    rounding = 18
    position = 0, -80
    halign = center
    valign = center
}
