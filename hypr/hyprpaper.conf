# hyprpaper — ersätter swaybg (temaomdesign 2026-09-14, se vault/04-tema/design.md)
#
# OBS: installerad hyprpaper-version (0.8.4, byggd mot hyprtoolkit) använder ett
# nyare config-schema än det klassiska preload=/wallpaper=. Se
# vault/03-felsokning/ för detaljer kring hur detta hittades.
#
# path pekar på en stabil symlink (.current.jpg), inte hela mappen längre -
# hyprpaper.conf ska inte behöva ändras för att byta bild eller schema.
# hypr/scripts/wallpaper-cycle.sh äger rotationen numera (varje heltimme, via
# systemd/wallpaper-cycle.timer) EFTERSOM den behöver veta exakt vilken bild
# som visas just nu för att dra rätt wallust-tema ur den - hyprpapers egna
# inbyggda bildspel (path = mapp + timeout/order) gick inte att fråga ut om
# aktuell bild utifrån (ingen text-hyprctl, bara ett binärt Hyprwire-IPC).
# Se vault/04-tema/dynamiskt-tema.md.
splash = 0
ipc = 1

wallpaper {
    monitor = eDP-1
    path = /home/jakob/dotfiles/images/backgrounds/.current.jpg
    fit_mode = cover
}
